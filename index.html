<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evento de prueba</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="portada.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 1. PANTALLA DE INICIO / BIENVENIDA -->
<div id="pantalla-inicio" class="seccion-inicio">
    <div class="sobre-invitacion" onclick="abrirInvitacion()">
        <img src="tu-imagen-de-portada.jpg" alt="Portada de la Invitación" class="imagen-click">
        <p class="indicador-click">Toca la imagen para abrir</p>
    </div>
</div>

<!-- 2. CONTENIDO PRINCIPAL (Oculto inicialmente) -->
<main id="contenido-invitacion" class="contenido-oculto">
    
    <!-- Sección: Temporizador / Cuenta Regresiva -->
    <section id="cuenta-regresiva" class="seccion-bloque">
        <h2>¡Falta muy poco!</h2>
        <div id="timer"><!-- Aquí se inyecta el contador con JS --></div>
    </section>

    <!-- Sección: Detalles del Evento (Fecha y Lugar) -->
    <section id="detalles" class="seccion-bloque">
        <h2>¿Cuándo y Dónde?</h2>
        <p>Fecha: 26 de Diciembre de 2026</p>
        <p>Lugar: Salón de Eventos, Acapulco</p>
    </section>

    <!-- Sección: Confirmación (RSVP) -->
    <section id="confirmacion" class="seccion-bloque">
        <h2>Confirmar Asistencia</h2>
        <button class="btn-confirmar">Confirmar por WhatsApp</button>
    </section>

</main>
</body>
</html>
