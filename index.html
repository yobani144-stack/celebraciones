<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El One Piece Existe</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href="portada.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <audio id="bg-music" src="musica_one_piece.mp3" loop></audio>
    <section class="envelope-wrapper" id="envelope-section">
        <div class="envelope">
            <div class="text-top">el one piece...</div>
            <div class="fold-left"></div>
            <div class="fold-right"></div>

            <div class="seal-container" id="openBtn">
                <div class="wax-seal">
                    <img src="img/sello2.jpeg" alt="Sello">
                </div>
                <div class="btn-abrir">ABRIR</div>
            </div>

            <div class="text-bottom">existe</div>
        </div>
    </section>

   <section class="details-wrapper hidden" id="invitation-content">
    <div class="elegant-bg-overlay"></div> <div class="invitation-card">
        <div class="jolly-roger-container">
            <img src="img/onepiecelogo.jpeg" alt="One Piece Logo" class="main-logo">
        </div>

        <div class="info-content">
            <p class="pre-title">ESTÁS INVITADO AL CUMPLEAÑOS DE</p>
            <h1 class="birthday-name">Monkey D. Luffy</h1> <div class="divider">
                <span class="line"></span>
                <span class="star">★</span>
                <span class="line"></span>
            </div>

            <p class="event-date">SÁBADO, 20 DE MAYO DE 2026</p>
            
            <div class="scroll-indicator">
                <p>Desliza para ver más</p>
                <div class="arrow-down"></div>
            </div>
        </div>
    </div>
</section>
    <section class="details-wrapper hidden" id="invitation-content"></section>
    <script src="js/script.js"></script>
</body>
</html>
