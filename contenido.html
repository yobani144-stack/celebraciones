<div class="elegant-bg-overlay"></div>

<button class="music-toggle" id="musicBtn" aria-label="Controlar música">
    <span class="music-icon">🎵</span>
</button>

<div class="invitation-card">
    <div class="jolly-roger-container">
        <img src="background_one_piece.jpg" alt="Jolly Roger" class="main-logo">
    </div>

    <div class="info-content">
        <p class="pre-title">ESTÁS INVITADO AL CUMPLEAÑOS DE</p>
        <h1 class="birthday-name">Monkey D. Luffy</h1> 
        
        <div class="divider">
            <span class="line"></span>
            <span class="star">★</span>
            <span class="line"></span>
        </div>

        <p class="event-date">SÁBADO, 20 DE MAYO DE 2026</p>
        
        <div class="countdown-container">
            <div class="countdown-box"><span class="countdown-number" id="days">00</span><span class="countdown-label">Días</span></div>
            <div class="countdown-box"><span class="countdown-number" id="hours">00</span><span class="countdown-label">Horas</span></div>
            <div class="countdown-box"><span class="countdown-number" id="minutes">00</span><span class="countdown-label">Min.</span></div>
            <div class="countdown-box"><span class="countdown-number" id="seconds">00</span><span class="countdown-label">Seg.</span></div>
        </div>
        
        <div class="scroll-indicator">
            <p>Desliza para ver más</p>
            <div class="arrow-down"></div>
        </div>
    </div>
</div>
