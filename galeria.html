<section id="seccion-galeria" class="galeria-contenedor">
    <div class="galeria-header">
        <span class="galeria-subtitulo">Nuestros Momentos</span>
        <h3 class="galeria-titulo">Galería de Recuerdos</h3>
        <div class="linea-decorativa"></div>
    </div>

    <div class="carrusel-escena">
        <div class="carrusel-track">
            
            <div class="carrusel-item active" data-index="0">
                <img src="img/galeria1.jpg" alt="Momento 1">
            </div>
            
            <div class="carrusel-item" data-index="1">
                <img src="img/verde.jpeg" alt="Momento 2">
            </div>
            
            <div class="carrusel-item" data-index="2">
                <img src="img/noviod.jpeg" alt="Momento 3">
            </div>
            
            <div class="carrusel-item" data-index="3">
                <img src="img/fondoverde.jpeg" alt="Momento 4">
            </div>
            
            <div class="carrusel-item" data-index="4">
                <img src="img/noviod.jpeg" alt="Momento 5">
            </div>

        </div>

        <button class="carrusel-control prev" id="carrusel-prev">‹</button>
        <button class="carrusel-control next" id="carrusel-next">›</button>
    </div>

    <div class="carrusel-indicadores">
        <span class="punto active" data-index="0"></span>
        <span class="punto" data-index="1"></span>
        <span class="punto" data-index="2"></span>
        <span class="punto" data-index="3"></span>
        <span class="punto" data-index="4"></span>
